name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: .
      ALPACA_API_KEY: ci-test-key
      ALPACA_SECRET_KEY: ci-test-secret
      ALPACA_PAPER: "true"
      TELEGRAM_ENABLED: "false"
      GEMINI_API_KEY: ""
      TRADING_BOT_SKIP_LLM: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: NLTK data (VADER sentiment tests)
        run: |
          python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      - name: Syntax check
        run: python -m compileall src app scripts -q

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  deploy-gate:
    runs-on: ubuntu-latest
    needs: [test, cms-import]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deploy scripts
        run: |
          chmod +x scripts/run_cms.sh scripts/run_bot_once.sh scripts/install_cms_service.sh scripts/install_candidate_cache_timer.sh
          test -x scripts/run_cms.sh
          test -x scripts/install_cms_service.sh

      - name: Write deployment summary
        run: |
          mkdir -p dist
          cat > dist/deployment-summary.txt <<'EOF'
          CI/CD gate passed.

          Host deploy (systemd user units):
            bash scripts/install_cms_service.sh
            systemctl --user enable --now trading-bot-cms.service
            bash scripts/install_candidate_cache_timer.sh
            systemctl --user enable --now trading-bot-candidate-cache.timer

          CMS default: http://localhost:8502
          EOF
          cat dist/deployment-summary.txt

      - name: Upload deployment summary
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary
          path: dist/deployment-summary.txt
          retention-days: 14

  cms-import:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify CMS helpers import
        run: |
          PYTHONPATH=. python -c "
          from src.cms_helpers import classify_buy_candidates, cache_age_minutes
          from src.candidate_cache import build_candidate_cache
          print('CMS imports OK')
          "
